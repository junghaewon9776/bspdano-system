<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>축제 배치도 · 실시간 위치관제</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;display:flex}

/* 왼쪽 사이드바 */
#sidebar{width:320px;min-width:320px;height:100vh;background:#0f172a;border-right:1px solid #1e293b;display:flex;flex-direction:column;z-index:100;overflow:hidden}
#sidebar.collapsed{width:44px;min-width:44px}
#sidebar.collapsed .sb-body,#sidebar.collapsed .sb-header span,#sidebar.collapsed .sb-header .hbtn:not(.toggle-btn){display:none}
.sb-header{padding:10px 12px;background:#1e293b;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-header h3{font-size:14px;flex:1;white-space:nowrap}
.hbtn{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;padding:4px;border-radius:4px}
.hbtn:hover{color:#fff;background:rgba(255,255,255,0.1)}

/* 탭 */
.sb-tabs{display:flex;border-bottom:1px solid #1e293b;flex-shrink:0}
.sb-tab{flex:1;padding:8px;border:none;background:transparent;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.sb-tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.sb-body{flex:1;overflow-y:auto;padding:8px}

/* 카테고리 카드 */
.cat-card{background:#1e293b;border-radius:10px;margin-bottom:8px;overflow:hidden;border:1px solid #334155}
.cat-card.selected{border-color:#3b82f6}
.cat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.cat-head:hover{background:rgba(255,255,255,0.03)}
.cat-color{width:16px;height:16px;border-radius:4px;flex-shrink:0;cursor:pointer;border:2px solid rgba(255,255,255,0.2)}
.cat-title{flex:1;font-size:13px;font-weight:700}
.cat-count{background:#334155;color:#94a3b8;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
.cat-toggle{color:#64748b;font-size:12px;transition:transform .2s}
.cat-toggle.open{transform:rotate(90deg)}

.cat-body{padding:0 12px 10px;display:none}
.cat-body.open{display:block}
.cat-setting{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:11px;color:#94a3b8}
.cat-setting label{width:48px;flex-shrink:0;font-weight:600}
.cat-setting input,.cat-setting select{flex:1;padding:4px 6px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#fff;font-size:11px}
.cat-setting input[type=color]{width:32px;height:24px;padding:0;border:none;cursor:pointer;background:transparent}

/* 색상 팔레트 */
.color-palette{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-dot:hover{transform:scale(1.15);border-color:rgba(255,255,255,0.5)}
.color-dot.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.5);transform:scale(1.15)}
.cat-setting input[type=number]{width:50px;flex:none}

.cat-items{margin-top:8px;border-top:1px solid #334155;padding-top:6px}
.cat-item{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:11px}
.cat-item:hover{background:rgba(255,255,255,0.05)}
.cat-item.active{background:rgba(59,130,246,0.2)}
.cat-item-num{font-weight:700;width:36px;text-align:center;flex-shrink:0}
.cat-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cat-btns{display:flex;gap:4px;margin-top:8px}
.cat-btns button{flex:1;padding:5px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}

/* 시설 정보 (개별 아이템) */
#itemPanel{padding:8px;display:none}
#itemPanel h4{font-size:13px;margin-bottom:8px}
#itemPanel label{display:block;color:#94a3b8;font-size:10px;margin:6px 0 2px;font-weight:600}
#itemPanel input,#itemPanel textarea{width:100%;padding:6px 8px;border:1px solid #334155;border-radius:5px;background:#0f172a;color:#fff;font-size:12px}
#itemPanel textarea{height:40px;resize:vertical}
.item-btns{display:flex;gap:4px;margin-top:10px}
.item-btns button{flex:1;padding:6px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}

/* 추적 목록 */
.track-item{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.03);margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.on{background:#10b981;box-shadow:0 0 6px #10b981}
.dot.off{background:#6b7280}

/* 지도 */
#mapWrap{flex:1;position:relative}
#map{width:100%;height:100vh}

/* 범례 */
#legend{position:absolute;right:10px;bottom:10px;background:rgba(15,15,30,0.92);border-radius:10px;padding:8px 12px;z-index:50;font-size:10px}
.leg-row{display:flex;align-items:center;gap:5px;margin:2px 0}
.leg-swatch{width:12px;height:9px;border-radius:2px}

/* 카카오 라벨 */
.f-label{padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,0.5);color:#fff}
.gps-label{background:rgba(16,185,129,0.9);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}
.gps-label.vehicle{background:rgba(59,130,246,0.9)}

/* 새 카테고리 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:#1e293b;border-radius:14px;padding:20px;width:340px;max-width:90vw}
.modal h3{color:#fff;margin-bottom:14px;font-size:15px}
.modal label{display:block;color:#94a3b8;font-size:11px;margin:8px 0 3px;font-weight:600}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#fff;font-size:13px}
.modal-row{display:flex;gap:6px;align-items:center}
.modal-row input{flex:1}
.modal-btns{display:flex;gap:6px;margin-top:14px}
.modal-btns button{flex:1;padding:9px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}

/* 주소 검색 */
#searchBox{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;width:360px;max-width:70vw}
#searchBox input{flex:1;padding:8px 12px;border:1px solid #475569;border-radius:8px;background:rgba(15,23,42,0.92);color:#fff;font-size:13px;backdrop-filter:blur(8px)}
#searchBox input::placeholder{color:#64748b}
#searchBox button{padding:8px 14px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
#searchResults{position:absolute;top:44px;left:0;right:0;background:rgba(15,23,42,0.95);border-radius:8px;max-height:200px;overflow-y:auto;display:none;backdrop-filter:blur(8px)}
.sr-item{padding:8px 12px;color:#e2e8f0;font-size:12px;cursor:pointer;border-bottom:1px solid #1e293b}
.sr-item:hover{background:rgba(59,130,246,0.2)}
.sr-addr{color:#94a3b8;font-size:10px;margin-top:1px}

/* 그리기 모드 */
#drawIndicator{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(220,38,38,0.92);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;display:none;backdrop-filter:blur(8px);white-space:nowrap}

/* 선 방향 화살표 */
.line-arrow{font-size:18px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,0.6);pointer-events:none}

/* 지도 설정 버튼 */
#mapBtns{position:absolute;top:10px;right:10px;z-index:50;display:flex;flex-direction:column;gap:4px}
#mapBtns button{padding:6px 10px;border:none;border-radius:6px;background:rgba(15,23,42,0.9);color:#e2e8f0;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);border:1px solid #334155}
#mapBtns button:hover{background:rgba(59,130,246,0.8);color:#fff}

/* 검색 핀 닫기 */
.pin-close{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px;margin-left:4px}
.pin-close:hover{color:#fff}

/* 반응형 */
@media(max-width:700px){
  #sidebar{position:fixed;left:0;top:0;z-index:300;width:280px;min-width:280px;box-shadow:4px 0 20px rgba(0,0,0,0.5)}
  #sidebar.collapsed{width:44px;min-width:44px;box-shadow:none}
  #searchBox{width:200px}
}
</style>
</head>
<body>

<!-- 사이드바 -->
<div id="sidebar">
  <div class="sb-header">
    <h3>🏗️ 축제 배치도</h3>
    <span>
      <button class="hbtn" onclick="saveAll()" title="전체 저장">💾</button>
      <button class="hbtn" onclick="location.href='index.html'" title="메인으로">🏠</button>
    </span>
    <button class="hbtn toggle-btn" onclick="toggleSidebar()" title="접기/펼치기">☰</button>
  </div>
  <div class="sb-tabs">
    <button class="sb-tab active" onclick="switchTab('layout',this)">🗺️ 배치도</button>
    <button class="sb-tab" onclick="switchTab('track',this)">📡 위치추적</button>
  </div>

  <!-- 배치도 탭 바디 -->
  <div class="sb-body" id="layoutBody">
    <div id="catList"></div>
    <button onclick="showNewCatModal()" style="width:100%;padding:8px;border:1px dashed #475569;border-radius:8px;background:transparent;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px">＋ 새 카테고리 추가</button>
    <!-- 개별 아이템 편집 -->
    <div id="itemPanel">
      <h4 id="itemTitle">아이템 편집</h4>
      <label>번호</label>
      <input id="iNum" type="text" placeholder="B-01">
      <label>이름 / 행사명</label>
      <input id="iName" type="text" placeholder="영광굴비 홍보부스">
      <label>담당자</label>
      <input id="iDuty" type="text" placeholder="담당자">
      <label>연락처</label>
      <input id="iPhone" type="text" placeholder="010-0000-0000">
      <label>메모</label>
      <textarea id="iMemo" placeholder="비고"></textarea>
      <div class="item-btns">
        <button style="background:#3b82f6;color:#fff" onclick="applyItem()">적용</button>
        <button style="background:#dc2626;color:#fff" onclick="deleteItem()">삭제</button>
        <button style="background:#475569;color:#fff" onclick="closeItem()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 추적 탭 바디 -->
  <div class="sb-body" id="trackBody" style="display:none">
    <div style="display:flex;gap:4px;margin-bottom:8px">
      <button onclick="showRegModal('person')" style="flex:1;padding:7px;border:none;border-radius:6px;background:#10b981;color:#fff;font-size:11px;font-weight:700;cursor:pointer">＋ 인원</button>
      <button onclick="showRegModal('vehicle')" style="flex:1;padding:7px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:11px;font-weight:700;cursor:pointer">＋ 차량</button>
      <button onclick="showGPSModal()" style="flex:1;padding:7px;border:none;border-radius:6px;background:#f59e0b;color:#000;font-size:11px;font-weight:700;cursor:pointer">📍 GPS공유</button>
    </div>
    <div id="trackList"></div>
  </div>
</div>

<!-- 지도 영역 -->
<div id="mapWrap">
  <div id="map"></div>
  <!-- 주소 검색 -->
  <div id="searchBox">
    <input id="addrInput" type="text" placeholder="주소·장소 검색" onkeydown="if(event.key==='Enter')searchAddr()">
    <button onclick="searchAddr()">검색</button>
    <div id="searchResults"></div>
  </div>
  <!-- 그리기 모드 표시 -->
  <div id="drawIndicator">🖊 그리기 모드 — 클릭으로 점 추가, 더블클릭으로 완료 (ESC 취소)</div>
  <!-- 지도 버튼들 -->
  <div id="mapBtns">
    <button onclick="saveMapPos()">📍 현재위치 기본설정</button>
    <button onclick="clearSearchPin()">🔍 핀 제거</button>
  </div>
  <div id="legend"></div>
</div>

<!-- 새 카테고리 모달 -->
<div id="newCatModal" class="modal-bg" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>📁 새 카테고리</h3>
    <label>카테고리 이름</label>
    <input id="ncName" type="text" placeholder="예: 행사부스">
    <label>도형</label>
    <select id="ncShape">
      <option value="rect">사각형</option>
      <option value="circle">원형</option>
      <option value="line">선 (경로)</option>
      <option value="polygon">다각형 (올가미)</option>
    </select>
    <div id="ncRectSize">
      <label>기본 크기 (가로m × 세로m)</label>
      <div class="modal-row">
        <input id="ncW" type="number" value="3" min="0.5" max="200" step="0.5">
        <span style="color:#94a3b8">×</span>
        <input id="ncH" type="number" value="6" min="0.5" max="200" step="0.5">
      </div>
    </div>
    <div id="ncCircleSize" style="display:none">
      <label>기본 지름 (m)</label>
      <input id="ncDiam" type="number" value="5" min="0.5" max="200" step="0.5">
    </div>
    <div id="ncLineOpts" style="display:none">
      <label>방향</label>
      <select id="ncDirection">
        <option value="none">없음</option>
        <option value="oneway">일방통행 →</option>
        <option value="twoway">양방통행 ↔</option>
      </select>
      <label>선 굵기 (px)</label>
      <input id="ncStrokeW" type="number" value="4" min="1" max="20">
    </div>
    <label>색상</label>
    <div class="color-palette" id="ncPalette"></div>
    <input id="ncColor" type="hidden" value="#FF6B6B">
    <label>번호 접두어</label>
    <input id="ncPrefix" type="text" placeholder="예: B" maxlength="5">
    <div class="modal-btns">
      <button style="background:#10b981;color:#fff" onclick="createCategory()">생성</button>
      <button style="background:#475569;color:#fff" onclick="document.getElementById('newCatModal').style.display='none'">취소</button>
    </div>
  </div>
</div>

<!-- 카테고리 편집 모달 -->
<div id="editCatModal" class="modal-bg" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3 id="ecTitle">카테고리 설정</h3>
    <label>카테고리 이름</label>
    <input id="ecName" type="text">
    <label>도형</label>
    <select id="ecShape">
      <option value="rect">사각형</option>
      <option value="circle">원형</option>
      <option value="line">선 (경로)</option>
      <option value="polygon">다각형 (올가미)</option>
    </select>
    <div id="ecRectSize">
      <label>기본 크기 (가로m × 세로m)</label>
      <div class="modal-row">
        <input id="ecW" type="number" min="0.5" max="200" step="0.5">
        <span style="color:#94a3b8">×</span>
        <input id="ecH" type="number" min="0.5" max="200" step="0.5">
      </div>
    </div>
    <div id="ecCircleSize" style="display:none">
      <label>기본 지름 (m)</label>
      <input id="ecDiam" type="number" min="0.5" max="200" step="0.5">
    </div>
    <div id="ecLineOpts" style="display:none">
      <label>방향</label>
      <select id="ecDirection">
        <option value="none">없음</option>
        <option value="oneway">일방통행 →</option>
        <option value="twoway">양방통행 ↔</option>
      </select>
      <label>선 굵기 (px)</label>
      <input id="ecStrokeW" type="number" min="1" max="20">
    </div>
    <label>색상 (변경 시 전체 아이템 적용)</label>
    <div class="color-palette" id="ecPalette"></div>
    <input id="ecColor" type="hidden">
    <label>번호 접두어</label>
    <input id="ecPrefix" type="text" maxlength="5">
    <div class="modal-btns">
      <button style="background:#3b82f6;color:#fff" onclick="updateCategory()">적용</button>
      <button style="background:#dc2626;color:#fff" onclick="deleteCategory()">카테고리 삭제</button>
      <button style="background:#475569;color:#fff" onclick="document.getElementById('editCatModal').style.display='none'">취소</button>
    </div>
  </div>
</div>

<!-- 등록 모달 (추적) -->
<div id="regModal" class="modal-bg" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3 id="rmTitle">등록</h3>
    <label>이름 / 차량번호</label>
    <input id="rmName" type="text">
    <label>유형</label>
    <select id="rmType"><option value="person">인원</option><option value="vehicle">차량</option></select>
    <label>연락처</label>
    <input id="rmPhone" type="text" placeholder="010-0000-0000">
    <label>메모</label>
    <input id="rmMemo" type="text" placeholder="역할, 소속">
    <div class="modal-btns">
      <button style="background:#10b981;color:#fff" onclick="registerTracker()">등록</button>
      <button style="background:#475569;color:#fff" onclick="document.getElementById('regModal').style.display='none'">취소</button>
    </div>
  </div>
</div>

<!-- GPS 공유 모달 -->
<div id="gpsModal" class="modal-bg" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>📍 내 위치 공유</h3>
    <p style="color:#94a3b8;font-size:12px;margin-bottom:10px">본부에서 내 위치를 실시간으로 확인합니다</p>
    <label>대상 선택</label>
    <select id="gpsSel" style="margin-bottom:8px"></select>
    <div id="gpsStat" style="text-align:center;padding:12px;color:#94a3b8;font-size:13px">GPS 대기 중...</div>
    <div class="modal-btns">
      <button id="gpsStartBtn" style="background:#10b981;color:#fff" onclick="startGPS()">📍 공유 시작</button>
      <button id="gpsStopBtn" style="background:#dc2626;color:#fff;display:none" onclick="stopGPS()">⏹ 중지</button>
      <button style="background:#475569;color:#fff" onclick="document.getElementById('gpsModal').style.display='none'">닫기</button>
    </div>
  </div>
</div>

<!-- 지도 기본위치 모달 -->
<div id="mapCfgModal" class="modal-bg" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>📍 지도 기본 위치 설정</h3>
    <p style="color:#94a3b8;font-size:12px;margin-bottom:12px">현재 지도 화면을 기본 위치로 저장합니다</p>
    <div class="cat-setting"><label>위도</label><input id="mcLat" type="text" readonly></div>
    <div class="cat-setting"><label>경도</label><input id="mcLng" type="text" readonly></div>
    <div class="cat-setting"><label>줌</label><input id="mcLvl" type="text" readonly></div>
    <div class="modal-btns">
      <button style="background:#3b82f6;color:#fff" onclick="confirmMapPos()">이 위치로 저장</button>
      <button style="background:#475569;color:#fff" onclick="document.getElementById('mapCfgModal').style.display='none'">취소</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>

var PRESET_COLORS=['#FF6B6B','#4ECDC4','#95E1D3','#FFA45B','#A66CFF','#3498db','#e67e22','#27ae60','#e74c3c','#f1c40f','#9b59b6','#1abc9c','#e91e63','#00bcd4','#8bc34a','#ff5722'];

function renderPalette(containerId,hiddenId,selectedColor){
  var el=document.getElementById(containerId);
  el.innerHTML='';
  PRESET_COLORS.forEach(function(c){
    var dot=document.createElement('div');

function loadKakao(){
  var s=document.createElement('script');
  s.src='//dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY_L+'&autoload=false&libraries=services';
  s.onload=function(){kakao.maps.load(initMap)};
  document.head.appendChild(s);
}

function initMap(){
  map=new kakao.maps.Map(document.getElementById('map'),{
    center:new kakao.maps.LatLng(DEFAULT_CENTER.lat,DEFAULT_CENTER.lng),
    level:DEFAULT_LEVEL,mapTypeId:kakao.maps.MapTypeId.HYBRID
  });

  // 지도 클릭
  kakao.maps.event.addListener(map,'click',function(e){
    if(_drawMode){
      _drawMode.points.push({lat:e.latLng.getLat(),lng:e.latLng.getLng()});
      updateDrawPreview();
      return;
    }
    deselectItem();
  });

  // 더블클릭 → 그리기 완료
  kakao.maps.event.addListener(map,'dblclick',function(e){
    if(_drawMode){
      e.preventDefault && e.preventDefault();
      finishDraw();
    }
  });

  // ESC → 그리기 취소
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&_drawMode)cancelDraw();
  });

  loadMapConfig();
  loadData();
  loadTrackers();
  listenGPS();
  if(location.search.indexOf('gps=1')>=0)setTimeout(showGPSModal,500);
}

  if(cat.shape==='line'){
    var dir=cat.direction==='oneway'?' 일방→':cat.direction==='twoway'?' 양방↔':'';
    return '선'+dir+' '+cat.strokeWeight+'px';
  }

// ═══ 도형 좌표 계산 ═══
function getRectPts(lat,lng,wM,hM){
  var dLat=hM/M_LAT,dLng=wM/mLng(lat);
  var hw=dLng/2,hh=dLat/2;
  return[
    new kakao.maps.LatLng(lat+hh,lng-hw),new kakao.maps.LatLng(lat+hh,lng+hw),
    new kakao.maps.LatLng(lat-hh,lng+hw),new kakao.maps.LatLng(lat-hh,lng-hw)
  ];
}
function getCirclePts(lat,lng,r,n){
  n=n||36;var pts=[];
  for(var i=0;i<n;i++){
    var a=2*Math.PI*i/n;
    pts.push(new kakao.maps.LatLng(lat+r*Math.cos(a)/M_LAT, lng+r*Math.sin(a)/mLng(lat)));
  }
  return pts;
}
function pathCenter(path){
  var sLat=0,sLng=0;
  path.forEach(function(p){sLat+=p.lat;sLng+=p.lng});
  return{lat:sLat/path.length,lng:sLng/path.length};
}

// ═══ 아이템 그리기 ═══
function drawItem(idx){
  var it=items[idx];
  var cat=categories.find(function(c){return c.id===it.catId});
  if(!cat)return;
  var color=cat.color;

  clearItemGfx(it);
  it._arrows=[];

  var pts;
  if(it.shape==='line'){
    // 폴리라인
    if(!it.path||it.path.length<2)return;
    pts=it.path.map(function(p){return new kakao.maps.LatLng(p.lat,p.lng)});
    it._poly=new kakao.maps.Polyline({
      path:pts,strokeWeight:cat.strokeWeight||4,strokeColor:color,strokeOpacity:0.9,strokeStyle:'solid'
    });
    it._poly.setMap(map);
    // 방향 화살표
    if(cat.direction==='oneway'&&pts.length>=2){
      addArrow(it,pts[pts.length-2],pts[pts.length-1],color);
    } else if(cat.direction==='twoway'&&pts.length>=2){
      addArrow(it,pts[pts.length-2],pts[pts.length-1],color);
      addArrow(it,pts[1],pts[0],color);
    }
    var cen=pathCenter(it.path);
    it.lat=cen.lat;it.lng=cen.lng;

  } else if(it.shape==='polygon'){
    if(!it.path||it.path.length<3)return;
    pts=it.path.map(function(p){return new kakao.maps.LatLng(p.lat,p.lng)});
    it._poly=new kakao.maps.Polygon({
      path:pts,strokeWeight:2,strokeColor:color,strokeOpacity:0.9,
      fillColor:color,fillOpacity:0.4
    });
    it._poly.setMap(map);
    var cen=pathCenter(it.path);
    it.lat=cen.lat;it.lng=cen.lng;

  } else if(it.shape==='circle'){
    pts=getCirclePts(it.lat,it.lng,(it.diameter||5)/2);
    it._poly=new kakao.maps.Polygon({
      path:pts,strokeWeight:2,strokeColor:color,strokeOpacity:0.9,
      fillColor:color,fillOpacity:0.4
    });
    it._poly.setMap(map);

  } else {
    pts=getRectPts(it.lat,it.lng,it.w,it.h);
    it._poly=new kakao.maps.Polygon({
      path:pts,strokeWeight:2,strokeColor:color,strokeOpacity:0.9,
      fillColor:color,fillOpacity:0.4
    });
    it._poly.setMap(map);
  }

  // 라벨
  var txt=it.num+(it.name?' '+it.name:'');
  it._label=new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(it.lat,it.lng),
    content:'<div class="f-label" style="background:'+color+'cc">'+txt+'</div>',
    yAnchor:0.5
  });
  it._label.setMap(map);

  // 클릭
  kakao.maps.event.addListener(it._poly,'click',function(){selectItem(idx)});

  // 드래그 (전체 도형 이동)
  var drag=false,sx,sy,slat,slng,sPath;
  kakao.maps.event.addListener(it._poly,'mousedown',function(e){
    drag=true;sx=e.point.x;sy=e.point.y;slat=it.lat;slng=it.lng;
    if(it.path)sPath=it.path.map(function(p){return{lat:p.lat,lng:p.lng}});
    map.setDraggable(false);
  });
  kakao.maps.event.addListener(map,'mousemove',function(e){
    if(!drag)return;
    var proj=map.getProjection();
    var sp=proj.containerPointFromCoords(new kakao.maps.LatLng(slat,slng));
    var np=new kakao.maps.Point(sp.x+(e.point.x-sx),sp.y+(e.point.y-sy));
    var nc=proj.coordsFromContainerPoint(np);
    var dLat=nc.getLat()-slat, dLng=nc.getLng()-slng;
    it.lat=slat+dLat;it.lng=slng+dLng;

    if(it.path&&sPath){
      it.path=sPath.map(function(p){return{lat:p.lat+dLat,lng:p.lng+dLng}});
      var newPts=it.path.map(function(p){return new kakao.maps.LatLng(p.lat,p.lng)});
      it._poly.setPath(newPts);
    } else {
      var pts2;
      if(it.shape==='circle')pts2=getCirclePts(it.lat,it.lng,(it.diameter||5)/2);
      else pts2=getRectPts(it.lat,it.lng,it.w,it.h);
      it._poly.setPath(pts2);
    }
    it._label.setPosition(new kakao.maps.LatLng(it.lat,it.lng));
    // 화살표 업데이트
    if(it._arrows&&it._arrows.length){
      it._arrows.forEach(function(a){a.setMap(null)});
      it._arrows=[];
      if(it.shape==='line'&&it.path){
        var lpts=it.path.map(function(p){return new kakao.maps.LatLng(p.lat,p.lng)});
        if(cat.direction==='oneway'&&lpts.length>=2)addArrow(it,lpts[lpts.length-2],lpts[lpts.length-1],color);
        else if(cat.direction==='twoway'&&lpts.length>=2){addArrow(it,lpts[lpts.length-2],lpts[lpts.length-1],color);addArrow(it,lpts[1],lpts[0],color);}
      }
    }
  });
  kakao.maps.event.addListener(map,'mouseup',function(){
    if(drag){drag=false;map.setDraggable(true)}
  });
}

// 방향 화살표
function addArrow(it,from,to,color){
  var dLat=to.getLat()-from.getLat(), dLng=to.getLng()-from.getLng();
  var angle=Math.atan2(dLng,dLat);
  var deg=angle*180/Math.PI-90;
  var midLat=from.getLat()*0.2+to.getLat()*0.8;
  var midLng=from.getLng()*0.2+to.getLng()*0.8;
  var arrow=new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(midLat,midLng),
    content:'<div class="line-arrow" style="transform:rotate('+deg+'deg);color:'+color+'">▶</div>',
    yAnchor:0.5,xAnchor:0.5
  });
  arrow.setMap(map);
  if(!it._arrows)it._arrows=[];
  it._arrows.push(arrow);
}

function selectItem(idx){
  deselectItem();
  selectedItemIdx=idx;
  var it=items[idx];
  var cat=categories.find(function(c){return c.id===it.catId});
  if(it.shape==='line'){
    it._poly.setOptions({strokeWeight:(cat.strokeWeight||4)+2,strokeColor:'#fff'});
  } else {
    it._poly.setOptions({strokeWeight:4,strokeColor:'#fff',fillOpacity:0.6});
  }

  var p=document.getElementById('itemPanel');
  document.getElementById('itemTitle').textContent=it.num+' 편집'+(cat?' ('+cat.name+')':'');
  document.getElementById('iNum').value=it.num;
  document.getElementById('iName').value=it.name;
  document.getElementById('iDuty').value=it.duty||'';
  document.getElementById('iPhone').value=it.phone;
  document.getElementById('iMemo').value=it.memo||'';
  p.style.display='block';
  renderCategories();
}

function deselectItem(){
  if(selectedItemIdx>=0&&items[selectedItemIdx]){
    var it=items[selectedItemIdx];
    var cat=categories.find(function(c){return c.id===it.catId});
    if(cat){
      if(it.shape==='line')it._poly.setOptions({strokeWeight:cat.strokeWeight||4,strokeColor:cat.color});
      else it._poly.setOptions({strokeWeight:2,strokeColor:cat.color,fillOpacity:0.4});
    }
  }
  selectedItemIdx=-1;
  document.getElementById('itemPanel').style.display='none';
}

function applyItem(){
  if(selectedItemIdx<0)return;
  var it=items[selectedItemIdx];

  it.duty=document.getElementById('iDuty').value;

function deleteItem(){

  if(!confirm('삭제하시겠습니까?'))return;

// ══════════════════════════════════════
//  그리기 모드 (선 / 다각형)
// ══════════════════════════════════════
function startDrawMode(catId){
  var cat=categories.find(function(c){return c.id===catId});
  if(!cat)return;
  _drawMode={type:cat.shape,catId:catId,points:[],tempLine:null,tempMarkers:[]};
  document.getElementById('drawIndicator').style.display='block';
  var msg=cat.shape==='line'?'🖊 선 그리기':'🖊 다각형 그리기';
  document.getElementById('drawIndicator').textContent=msg+' — 클릭으로 점 추가, 더블클릭으로 완료 (ESC 취소)';
  toast(cat.name+' 그리기 시작 — 지도를 클릭하세요');
}

function updateDrawPreview(){
  if(!_drawMode)return;
  var cat=categories.find(function(c){return c.id===_drawMode.catId});
  var color=cat?cat.color:'#fff';

  if(_drawMode.tempLine){_drawMode.tempLine.setMap(null);_drawMode.tempLine=null;}
  _drawMode.tempMarkers.forEach(function(m){m.setMap(null)});
  _drawMode.tempMarkers=[];

  var pts=_drawMode.points.map(function(p){return new kakao.maps.LatLng(p.lat,p.lng)});

  if(pts.length>=2){
    if(_drawMode.type==='line'){
      _drawMode.tempLine=new kakao.maps.Polyline({
        path:pts,strokeWeight:cat.strokeWeight||4,strokeColor:color,strokeOpacity:0.8,strokeStyle:'solid'
      });
    } else {
      _drawMode.tempLine=new kakao.maps.Polygon({
        path:pts,strokeWeight:2,strokeColor:color,strokeOpacity:0.8,fillColor:color,fillOpacity:0.25
      });
    }
    _drawMode.tempLine.setMap(map);
  }

  pts.forEach(function(pt,i){
    var dotSize=i===0?'10px':'8px';
    var dotBorder=i===0?'3px':'2px';
    var m=new kakao.maps.CustomOverlay({
      position:pt,
      content:'<div style="width:'+dotSize+';height:'+dotSize+';background:#fff;border:'+dotBorder+' solid '+color+';border-radius:50%;cursor:pointer"></div>',
      yAnchor:0.5,xAnchor:0.5
    });
    m.setMap(map);
    _drawMode.tempMarkers.push(m);
  });
}

function finishDraw(){
  if(!_drawMode)return;
  var minPts=_drawMode.type==='line'?2:3;
  if(_drawMode.points.length<minPts){
    toast((_drawMode.type==='line'?'최소 2개':'최소 3개')+' 점이 필요합니다',true);
    return;
  }

  var cat=categories.find(function(c){return c.id===_drawMode.catId});
  if(!cat){cancelDraw();return}

  var cnt=items.filter(function(it){return it.catId===_drawMode.catId}).length;
  var cen=pathCenter(_drawMode.points);

  var it={
    id:nextItemId++,
    catId:_drawMode.catId,
    num:cat.prefix+'-'+String(cnt+1).padStart(2,'0'),
    name:'',duty:'',phone:'',memo:'',
    lat:cen.lat,lng:cen.lng,
    path:_drawMode.points.slice(),
    shape:_drawMode.type
  };

  cleanupDraw();
  items.push(it);
  drawItem(items.length-1);
  selectItem(items.length-1);
  renderCategories();
  toast(it.num+' 생성');

  var body=document.getElementById('catBody_'+cat.id);
  if(body&&!body.classList.contains('open'))toggleCat(cat.id);
}

function cancelDraw(){
  cleanupDraw();
  toast('그리기 취소');
}

function cleanupDraw(){
  if(!_drawMode)return;
  if(_drawMode.tempLine)_drawMode.tempLine.setMap(null);
  _drawMode.tempMarkers.forEach(function(m){m.setMap(null)});
  _drawMode=null;
  document.getElementById('drawIndicator').style.display='none';
}

// ══════════════════════════════════════
//  주소 검색
// ══════════════════════════════════════
function searchAddr(){
  var q=document.getElementById('addrInput').value.trim();
  if(!q){toast('검색어를 입력하세요',true);return}
  var ps=new kakao.maps.services.Places();
  ps.keywordSearch(q,function(data,status){
    if(status===kakao.maps.services.Status.OK){
      showSearchResults(data);
    } else {
      var gc=new kakao.maps.services.Geocoder();
      gc.addressSearch(q,function(result,st2){
        if(st2===kakao.maps.services.Status.OK) showSearchResults(result.map(function(r){return{place_name:r.address_name,road_address_name:r.road_address?r.road_address.address_name:'',address_name:r.address_name,y:r.y,x:r.x}}));
        else toast('검색 결과 없음',true);
      });
    }
  });
}

function showSearchResults(data){
  var el=document.getElementById('searchResults');
  el.innerHTML='';
  data.slice(0,8).forEach(function(place){
    var div=document.createElement('div');
    div.className='sr-item';
    var name=place.place_name||place.address_name||'';
    var addr=place.road_address_name||place.address_name||'';
    div.innerHTML='<div style="font-weight:600">'+name+'</div>'+(addr!==name?'<div class="sr-addr">'+addr+'</div>':'');
    div.onclick=function(){
      var lat=parseFloat(place.y),lng=parseFloat(place.x);
      map.setCenter(new kakao.maps.LatLng(lat,lng));
      map.setLevel(3);
      placeSearchPin(lat,lng,name);
      el.style.display='none';
      document.getElementById('addrInput').value=name;
    };
    el.appendChild(div);
  });
  el.style.display=data.length?'block':'none';
}

function placeSearchPin(lat,lng,name){
  clearSearchPin();
  _searchPin=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),map:map});
  _searchPinLabel=new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(lat,lng),
    content:'<div style="background:#3b82f6;color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap">📍 '+name+'<button class="pin-close" onclick="clearSearchPin()">✕</button></div>',
    yAnchor:2.2
  });
  _searchPinLabel.setMap(map);
}

function clearSearchPin(){
  if(_searchPin){_searchPin.setMap(null);_searchPin=null}
  if(_searchPinLabel){_searchPinLabel.setMap(null);_searchPinLabel=null}
}

// 검색 결과 닫기
document.addEventListener('click',function(e){
  var sb=document.getElementById('searchBox');
  if(sb&&!sb.contains(e.target))document.getElementById('searchResults').style.display='none';
});

// ══════════════════════════════════════
//  지도 기본 위치 설정
// ══════════════════════════════════════
function saveMapPos(){
  var c=map.getCenter();
  document.getElementById('mcLat').value=c.getLat().toFixed(6);
  document.getElementById('mcLng').value=c.getLng().toFixed(6);
  document.getElementById('mcLvl').value=map.getLevel();
  document.getElementById('mapCfgModal').style.display='flex';
}

function confirmMapPos(){
  var cfg={lat:parseFloat(document.getElementById('mcLat').value),lng:parseFloat(document.getElementById('mcLng').value),level:parseInt(document.getElementById('mcLvl').value)};
  fbDb.ref('/layout/mapConfig').set(cfg).then(function(){
    DEFAULT_CENTER.lat=cfg.lat;DEFAULT_CENTER.lng=cfg.lng;DEFAULT_LEVEL=cfg.level;
    toast('📍 지도 기본 위치 저장됨');
    document.getElementById('mapCfgModal').style.display='none';
  }).catch(function(e){toast('저장 실패',true)});
}

function loadMapConfig(){
  fbDb.ref('/layout/mapConfig').once('value').then(function(snap){
    var d=snap.val();
    if(d&&d.lat&&d.lng){
      DEFAULT_CENTER.lat=d.lat;DEFAULT_CENTER.lng=d.lng;
      if(d.level)DEFAULT_LEVEL=d.level;
      map.setCenter(new kakao.maps.LatLng(d.lat,d.lng));
      map.setLevel(d.level||2);
    }
  });
}

// ══════════════════════════════════════
//  범례
// ══════════════════════════════════════
function renderLegend(){
  var el=document.getElementById('legend');
  var html='';
  categories.forEach(function(cat){
    var cnt=items.filter(function(it){return it.catId===cat.id}).length;
    var sw=cat.shape==='line'?'border-radius:0;height:3px':'';
    html+='<div class="leg-row"><div class="leg-swatch" style="background:'+cat.color+';'+sw+'"></div> '+cat.name+' ('+cnt+')</div>';
  });
  html+='<div style="border-top:1px solid #334155;margin:4px 0"></div>';
  html+='<div class="leg-row"><div class="leg-swatch" style="background:#10b981;border-radius:50%"></div> 인원 GPS</div>';
  html+='<div class="leg-row"><div class="leg-swatch" style="background:#3b82f6;border-radius:50%"></div> 차량 GPS</div>';
  el.innerHTML=html;
}

// ══════════════════════════════════════
//  Firebase 저장/로드
// ══════════════════════════════════════
function saveAll(){
  var catData=categories.map(function(c){
    var d={id:c.id,name:c.name,shape:c.shape,color:c.color,prefix:c.prefix};
    if(c.shape==='rect'){d.w=c.w;d.h=c.h;}
    else if(c.shape==='circle'){d.diameter=c.diameter||5;}
    else if(c.shape==='line'){d.direction=c.direction||'none';d.strokeWeight=c.strokeWeight||4;}
    return d;
  });
  var itemData=items.map(function(it){
    var d={id:it.id,catId:it.catId,num:it.num,name:it.name,duty:it.duty||'',phone:it.phone,memo:it.memo||'',shape:it.shape,lat:it.lat,lng:it.lng};
    if(it.shape==='line'||it.shape==='polygon'){d.path=it.path;}
    else{d.w=it.w;d.h=it.h;d.diameter=it.diameter||5;}
    return d;
  });
  fbDb.ref('/layout').update({categories:catData,items:itemData}).then(function(){
    toast('💾 저장 완료 (카테고리 '+catData.length+', 아이템 '+itemData.length+')');
  }).catch(function(e){toast('저장 실패: '+e.message,true)});
}

function loadData(){
  fbDb.ref('/layout').once('value').then(function(snap){
    var d=snap.val();
    if(!d)return;
    if(d.categories&&Array.isArray(d.categories)){
      categories=d.categories.map(function(c){
        c.direction=c.direction||'none';
        c.strokeWeight=c.strokeWeight||4;
        c.w=c.w||3;c.h=c.h||6;c.diameter=c.diameter||5;
        return c;
      });
      var maxC=0;categories.forEach(function(c){if(c.id>maxC)maxC=c.id});
      nextCatId=maxC+1;
    }
    if(d.items&&Array.isArray(d.items)){
      items=d.items.map(function(it){
        it._poly=null;it._label=null;it._arrows=[];
        return it;
      });
      var maxI=0;items.forEach(function(it){if(it.id>maxI)maxI=it.id});
      nextItemId=maxI+1;
      items.forEach(function(it,i){drawItem(i)});
    }
    renderCategories();
    if(items.length)toast(items.length+'개 시설 로드됨');
  });
}

// ══════════════════════════════════════
//  추적
// ══════════════════════════════════════
function showRegModal(type){
  document.getElementById('rmType').value=type;
  document.getElementById('rmTitle').textContent=type==='vehicle'?'🚗 차량 등록':'👤 인원 등록';
  document.getElementById('rmName').value='';document.getElementById('rmPhone').value='';document.getElementById('rmMemo').value='';
  document.getElementById('regModal').style.display='flex';
}

function registerTracker(){
  var name=document.getElementById('rmName').value.trim();
  if(!name){toast('이름을 입력하세요',true);return}
  var t={id:Date.now(),type:document.getElementById('rmType').value,name:name,phone:document.getElementById('rmPhone').value.trim(),memo:document.getElementById('rmMemo').value.trim(),created:new Date().toISOString()};
  fbDb.ref('/layout/trackers/'+t.id).set(t).then(function(){
    toast(name+' 등록 완료');document.getElementById('regModal').style.display='none';
  }).catch(function(e){toast('등록 실패',true)});
}

function loadTrackers(){
  fbDb.ref('/layout/trackers').on('value',function(snap){
    trackers=[];var d=snap.val()||{};
    Object.keys(d).forEach(function(k){trackers.push(d[k])});
    renderTrackList();updateGPSSel();
  });
}

function renderTrackList(){
  var el=document.getElementById('trackList');
  if(!trackers.length){el.innerHTML='<div style="color:#94a3b8;padding:12px;font-size:12px;text-align:center">등록된 대상이 없습니다</div>';return}
  var html='';
  trackers.forEach(function(t){
    var pos=livePos[t.id];
    var on=pos&&(Date.now()-pos.ts<120000);
    html+='<div class="track-item">';
    html+='<div class="dot '+(on?'on':'off')+'"></div>';
    html+='<div style="flex:1;font-size:12px"><div style="font-weight:700">'+(t.type==='vehicle'?'🚗':'👤')+' '+t.name+'</div>';
    html+='<div style="color:#94a3b8;font-size:10px">'+(t.phone||'')+(t.memo?' · '+t.memo:'')+'</div>';
    if(on){var d=new Date(pos.ts);html+='<div style="color:#10b981;font-size:10px">📍 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+'</div>'}
    html+='</div>';
    if(on)html+='<button onclick="focusT('+t.id+')" style="background:#0ea5e9;color:#fff;border:none;padding:3px 6px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer">위치</button>';
    html+='<button onclick="delTracker('+t.id+')" style="background:#dc2626;color:#fff;border:none;padding:3px 5px;border-radius:4px;font-size:10px;cursor:pointer;margin-left:2px">✕</button>';
    html+='</div>';
  });
  el.innerHTML=html;
}

function focusT(id){var p=livePos[id];if(p){map.setCenter(new kakao.maps.LatLng(p.lat,p.lng));map.setLevel(2)}}
function delTracker(id){if(!confirm('삭제?'))return;fbDb.ref('/layout/trackers/'+id).remove();fbDb.ref('/layout/gps/'+id).remove();toast('삭제됨')}

function listenGPS(){
  fbDb.ref('/layout/gps').on('value',function(snap){
    livePos=snap.val()||{};renderGPSMarkers();renderTrackList();
  });
}

function renderGPSMarkers(){
  Object.keys(gpsMarkers).forEach(function(k){gpsMarkers[k].setMap(null);if(gpsLabels[k])gpsLabels[k].setMap(null)});
  gpsMarkers={};gpsLabels={};
  Object.keys(livePos).forEach(function(id){
    var p=livePos[id];if(!p||!p.lat||Date.now()-p.ts>120000)return;
    var tk=trackers.find(function(t){return String(t.id)===String(id)});
    var isV=tk&&tk.type==='vehicle';
    var nm=tk?tk.name:id;
    var img=new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',new kakao.maps.Size(24,35));
    var m=new kakao.maps.Marker({position:new kakao.maps.LatLng(p.lat,p.lng),image:img,map:map});
    gpsMarkers[id]=m;
    var lb=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.lat,p.lng),content:'<div class="gps-label'+(isV?' vehicle':'')+'">'+(isV?'🚗':'👤')+' '+nm+'</div>',yAnchor:2.2});
    lb.setMap(map);gpsLabels[id]=lb;
  });
}

function showGPSModal(){updateGPSSel();document.getElementById('gpsModal').style.display='flex'}
function updateGPSSel(){
  var s=document.getElementById('gpsSel');s.innerHTML='';
  trackers.forEach(function(t){var o=document.createElement('option');o.value=t.id;o.textContent=(t.type==='vehicle'?'🚗':'👤')+' '+t.name;s.appendChild(o)});
}

function startGPS(){
  if(!navigator.geolocation){toast('GPS 불가',true);return}
  var id=document.getElementById('gpsSel').value;if(!id){toast('대상 선택 필요',true);return}
  document.getElementById('gpsStartBtn').style.display='none';
  document.getElementById('gpsStopBtn').style.display='block';
  document.getElementById('gpsStat').innerHTML='<div style="color:#10b981">📍 위치 공유 중...</div>';
  gpsWatchId=navigator.geolocation.watchPosition(function(p){
    var d={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now(),acc:p.coords.accuracy||0};
    fbDb.ref('/layout/gps/'+id).set(d);
    document.getElementById('gpsStat').innerHTML='<div style="color:#10b981;font-size:13px">📍 공유 중<br><span style="font-size:11px;color:#94a3b8">'+d.lat.toFixed(5)+', '+d.lng.toFixed(5)+'</span></div>';
  },function(e){document.getElementById('gpsStat').innerHTML='<div style="color:#ef4444">오류: '+e.message+'</div>';
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}

function stopGPS(){
  if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}
  var id=document.getElementById('gpsSel').value;if(id)fbDb.ref('/layout/gps/'+id).remove();
  document.getElementById('gpsStartBtn').style.display='block';document.getElementById('gpsStopBtn').style.display='none';
  document.getElementById('gpsStat').innerHTML='GPS 대기 중...';toast('공유 중지');
}

function toast(m,err){
  var t=document.createElement('div');t.textContent=m;
  t.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;color:#fff;background:'+(err?'#dc2626':'#10b981');
  document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
}

loadKakao();
</script>
